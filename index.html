<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X Ads Mini Composer</title>
    <link rel="stylesheet" href="assets/app.css?v=20260814-5">
</head>

<body>
    <div class="shell">
        <div class="topbar">
            <div class="brand">
                <div class="x-logo">𝕏</div>
                <div>
                    <h1>X Ads Mini Composer</h1>
                    <div class="subtitle">Schedule Website Card posts about one minute ahead using the X Ads API.</div>
                </div>
            </div>
            <div class="account-pill">
                <select id="accountSelect" aria-label="X Ads account">
                    <option value="">Loading account…</option>
                </select>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="composer">Composer</button>
        </div>

        <details class="account-manager" id="accountManager">
            <summary>Manage accounts</summary>
            <div class="account-manager-body">
                <form id="accountForm" class="account-form" autocomplete="on">
                    <input id="accountEntityId" type="hidden">
                    <div class="field">
                        <label for="accountIdInput">Account ID</label>
                        <input id="accountIdInput" name="account_id" type="text" maxlength="32" required autocomplete="on">
                    </div>
                    <div class="field">
                        <label for="userIdInput">User ID</label>
                        <input id="userIdInput" name="user_id" type="text" inputmode="numeric" maxlength="32" required autocomplete="on">
                    </div>
                    <div class="account-form-actions">
                        <button class="btn btn-primary" id="accountSaveBtn" type="submit">Add account</button>
                        <button class="small-btn" id="accountCancelBtn" type="button" hidden>Cancel</button>
                    </div>
                </form>
                <div class="account-table-wrap">
                    <table class="account-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Account ID</th>
                                <th>User ID</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="accountTableBody"></tbody>
                    </table>
                </div>
            </div>
        </details>

        <div class="panel">
            <section class="view active" id="view-composer">
                <div class="composer-grid">
                    <div class="form-side">
                        <div class="field">
                            <label for="scheduleAt">
                                Schedule
                                <span class="hint">optional · defaults to +1 minute</span>
                            </label>
                            <input id="scheduleAt" type="datetime-local" step="60">
                        </div>

                        <div class="field">
                            <label for="websiteUrl">Website URL</label>
                            <input id="websiteUrl" type="text" placeholder="https://example.com" autocomplete="on">
                        </div>

                        <div class="field">
                            <label for="headline">Headline <span class="hint">required with website</span></label>
                            <input id="headline" type="text" maxlength="80" placeholder="Enter a headline" autocomplete="on">
                        </div>

                        <div class="field">
                            <label>
                                Selected media
                                <span class="hint" id="mediaCount">0 selected</span>
                            </label>
                            <div class="selected-strip" id="selectedStrip">
                                <span class="selected-empty">Choose media from the library.</span>
                            </div>
                        </div>

                        <div class="actions">
                            <button class="btn btn-primary" id="saveBtn">Schedule</button>
                        </div>
                    </div>

                    <aside class="media-side">
                        <div class="media-head">
                            <h2>Media Library</h2>
                            <button class="small-btn" id="refreshMediaBtn">Refresh</button>
                        </div>

                        <div class="media-toolbar">
                            <input type="search" id="mediaSearch" placeholder="Search media…" autocomplete="on">
                            <button class="small-btn" id="mediaSearchBtn">Search</button>
                        </div>

                        <div id="mediaGrid" class="media-grid"></div>
                        <button class="btn load-more" id="loadMoreMediaBtn" style="display:none">Load more</button>
                    </aside>
                </div>
            </section>
        </div>
    </div>

    <div class="status" id="status"></div>

    <script src="assets/app.js?v=20260815-1" defer></script>
</body>

</html>
